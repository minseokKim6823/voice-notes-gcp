server:
  port: ${PORT:8080}
  tomcat:
    connection-timeout: 10m
spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/voice_notes}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/voice_notes?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
  sql:
    init:
      mode: ${DATABASE_INIT_MODE:always}
      schema-locations: classpath:db/schema-mariadb.sql
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 24000000B
      max-request-size: 25000000B
voice-notes:
  analytics:
    enabled: ${CLICKHOUSE_ENABLED:true}
    url: ${CLICKHOUSE_URL:http://localhost:8123}
    database: ${CLICKHOUSE_DATABASE:voice_notes}
    username: ${CLICKHOUSE_USER:voice_notes}
    password: ${CLICKHOUSE_PASSWORD:local-analytics-only}
    timeout: ${CLICKHOUSE_TIMEOUT:3s}
  stt-provider: ${VOICE_NOTES_STT_PROVIDER:whisper}
  whisper:
    base-url: ${WHISPER_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    timeout: ${WHISPER_TIMEOUT:10m}
  project-id: ${GOOGLE_CLOUD_PROJECT:}
  bucket: ${VOICE_NOTES_BUCKET:}
  speech-location: ${VOICE_NOTES_SPEECH_LOCATION:us}
  speech-model: ${VOICE_NOTES_SPEECH_MODEL:chirp_3}
  speech-word-time-offsets: ${VOICE_NOTES_SPEECH_WORD_TIME_OFFSETS:false}
  exaone:
    base-url: ${GLM_BASE_URL:${EXAONE_BASE_URL:https://api.z.ai/api/paas/v4}}
    api-key: ${GLM_API_KEY:${EXAONE_API_KEY:}}
    model: ${GLM_MODEL:${EXAONE_MODEL:glm-4.7-flash}}
    timeout: ${GLM_TIMEOUT:${EXAONE_TIMEOUT:10m}}
    max-output-tokens: ${EXAONE_MAX_OUTPUT_TOKENS:4096}
    include-chat-template-kwargs: ${EXAONE_INCLUDE_CHAT_TEMPLATE_KWARGS:false}
