# Isolated databases for integration checks; never connects to the user's databases.
name: voice-notes-validation
services:
  mariadb:
    image: mariadb:11.2
    environment:
      MARIADB_DATABASE: voice_notes_test
      MARIADB_USER: voice_notes_test
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    ports:
      - "127.0.0.1:53317:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:53318:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
