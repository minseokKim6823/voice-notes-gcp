# Isolated databases for integration checks; never connects to the user's databases.
name: voice-notes-validation
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: voice_notes_test
      CLICKHOUSE_USER: voice_notes_test
      CLICKHOUSE_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:53319:8123"
    tmpfs:
      - /var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  mariadb:
    image: mariadb:11.2
    environment:
      MARIADB_DATABASE: voice_notes_test
      MARIADB_USER: voice_notes_test
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    ports:
      - "127.0.0.1:53317:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:53318:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
